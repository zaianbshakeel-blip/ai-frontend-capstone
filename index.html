<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Account Settings</h1>
    </header>

    <main>
      <section class="card">
        <form id="settings-form" novalidate>
          <div class="form-row">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required aria-describedby="username-error" />
            <span class="error" id="username-error" aria-live="polite"></span>
          </div>

          <div class="form-row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required aria-describedby="email-error" />
            <span class="error" id="email-error" aria-live="polite"></span>
          </div>

          <div class="form-row">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required aria-describedby="password-error" />
            <span class="error" id="password-error" aria-live="polite"></span>
          </div>

          <fieldset class="form-row" id="theme-fieldset">
            <legend>Theme</legend>
            <div class="radio-row">
              <label><input type="radio" name="theme" value="Light" required> Light</label>
              <label><input type="radio" name="theme" value="Dark"> Dark</label>
              <label><input type="radio" name="theme" value="Auto"> Auto</label>
            </div>
            <span class="error" id="theme-error" aria-live="polite"></span>
          </fieldset>

          <div class="form-row checkbox-row">
            <label>
              <input id="notifications" name="notifications" type="checkbox" />
              Enable notifications
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn">Save settings</button>
            <button type="reset" id="reset-btn">Reset</button>
          </div>

          <div id="success-message" class="success hidden" role="status" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <footer>
      <small>&copy; Settings</small>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
